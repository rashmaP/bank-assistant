name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # also lets you run the live-model evals by hand

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Byte-compile (catches syntax errors)
        run: python -m compileall -q assistant mock_bank common evals tests run_dev.py
      - name: Unit and HTTP tests (offline, no API key needed)
        run: python -m pytest -q

  # Manual only: needs a provider key stored as a repository secret.
  # Settings -> Secrets and variables -> Actions: add ANTHROPIC_API_KEY or OPENAI_API_KEY (e.g. a Groq key).
  live-evals:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.groq.com/openai/v1' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'llama-3.3-70b-versatile' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run live evals
        run: python -m evals.run_evals --repeat 2 --min-pass 0.8 --json evals/report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/report.json
