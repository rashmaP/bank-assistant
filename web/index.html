<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank assistant</title>
<style>
  :root {
    --bg: #eef1ec; --panel: #ffffff; --ink: #14241f; --muted: #5d6b65;
    --line: #d6ddd6; --brand: #1c5d4d; --brand-ink: #ffffff; --me: #e3efe9; --warn: #8a4b12;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1814; --panel: #16221d; --ink: #e6efe9; --muted: #98a8a0;
            --line: #2a3a33; --brand: #4fae93; --brand-ink: #0b1612; --me: #1e3a30; --warn: #e0a15e; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; justify-content: center; }
  .app { width: 100%; max-width: 720px; display: flex; flex-direction: column; height: 100%; background: var(--panel);
         border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  header { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 650; letter-spacing: .01em; }
  header span { color: var(--muted); font-size: .88rem; }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--bg); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--me); align-self: flex-end; border-bottom-right-radius: 4px; }
  .err { color: var(--warn); align-self: flex-start; font-size: .92rem; }
  .card { align-self: flex-start; width: min(86%, 440px); border: 1px solid var(--line); border-left: 4px solid var(--brand);
          border-radius: 8px; padding: 10px 14px; font-size: .93rem; }
  .card h2 { margin: 0 0 6px; font-size: .95rem; font-weight: 650; }
  .card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; }
  .card dt { color: var(--muted); } .card dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .card ul { margin: 0; padding: 0; list-style: none; }
  .card li { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; border-top: 1px solid var(--line); }
  .card li:first-child { border-top: 0; } .card li small { color: var(--muted); display: block; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 18px 10px; }
  .chips button { background: transparent; color: var(--brand); border: 1px solid var(--brand); border-radius: 999px;
                  padding: 6px 12px; font: inherit; font-size: .88rem; cursor: pointer; }
  form { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
  input { flex: 1; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
  button.send { background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 8px; padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  .dots::after { content: "…"; animation: blink 1s steps(3) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) { .dots::after { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header><h1>Bank assistant</h1><span id="who">Signing in…</span></header>
  <main id="log" aria-live="polite"></main>
  <div class="chips" id="chips"></div>
  <form id="f">
    <input id="in" autocomplete="off" maxlength="1000" placeholder="Ask about your balance, a debit, or a cheque book" aria-label="Message">
    <button class="send" id="go" type="submit" disabled>Send</button>
  </form>
</div>
<script>
const log = document.getElementById('log'), input = document.getElementById('in'), go = document.getElementById('go');
let token = null, sessionId = null;

// All server text is inserted with textContent: transaction narrations are third-party data.
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function add(node) { log.appendChild(node); log.scrollTop = log.scrollHeight; return node; }
function row(dl, k, v) { dl.appendChild(el('dt', null, k)); dl.appendChild(el('dd', null, v)); }

function renderCard(c) {
  const box = el('section', 'card'), d = c.data;
  if (c.type === 'balance') {
    box.appendChild(el('h2', null, `${d.account_type} account ${d.account_number_masked}`));
    const dl = el('dl'); row(dl, 'Available balance', d.available_balance_display); row(dl, 'Ledger balance', d.ledger_balance_display);
    row(dl, 'Pending holds', d.pending_holds_display); row(dl, 'As of', d.as_of); box.appendChild(dl);
  } else if (c.type === 'transactions') {
    box.appendChild(el('h2', null, `Matching transactions (${d.total_matches})`));
    const ul = el('ul');
    d.items.forEach(t => { const li = el('li'); const left = el('div', null, t.merchant);
      left.appendChild(el('small', null, `${t.date} · ${t.channel}${t.status === 'pending' ? ' · pending' : ''}`));
      li.appendChild(left); li.appendChild(el('div', null, `${t.direction === 'debit' ? '−' : '+'}${t.amount_display}`)); ul.appendChild(li); });
    box.appendChild(ul);
  } else if (c.type === 'service_request') {
    box.appendChild(el('h2', null, 'Cheque book request raised'));
    const dl = el('dl'); row(dl, 'Request ID', d.request_id); row(dl, 'Account', `${d.account_type} ${d.account_number_masked}`);
    row(dl, 'Leaves', String(d.leaves)); row(dl, 'Delivery', d.delivery); row(dl, 'Expected by', d.expected_delivery_date); box.appendChild(dl);
  } else return null;
  return box;
}

async function login() {
  const r = await fetch('/auth/demo-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ customer_id: 'CUST-1001' }) });
  if (!r.ok) throw new Error('Demo login failed');
  const j = await r.json(); token = j.token;
  document.getElementById('who').textContent = `Signed in as ${j.customer_name} (demo)`;
  add(el('div', 'msg bot', `Hello ${j.customer_name.split(' ')[0]}. I can show your balance, explain a debit, or request a cheque book. What would you like to do?`));
  go.disabled = false; input.focus();
}

async function send(text) {
  add(el('div', 'msg me', text)); go.disabled = true; input.value = '';
  const wait = add(el('div', 'msg bot dots', 'Thinking'));
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ message: text, session_id: sessionId }) });
    wait.remove();
    if (!r.ok) { const e = await r.json().catch(() => ({})); add(el('div', 'err', e.detail || 'Something went wrong. Please try again.')); return; }
    const j = await r.json(); sessionId = j.session_id;
    (j.cards || []).forEach(c => { const n = renderCard(c); if (n) add(n); });
    add(el('div', 'msg bot', j.reply));
  } catch (e) { wait.remove(); add(el('div', 'err', 'Could not reach the assistant. Check your connection and try again.')); }
  finally { go.disabled = false; input.focus(); }
}

document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); const t = input.value.trim(); if (t && token) send(t); });
const chips = document.getElementById('chips');
['What\u2019s my balance?', 'What was the debit of 649 rupees?', 'I need a cheque book'].forEach(t => {
  const b = el('button', null, t); b.type = 'button'; b.addEventListener('click', () => token && !go.disabled && send(t)); chips.appendChild(b);
});
login().catch(() => add(el('div', 'err', 'Could not sign in to the demo. Is the assistant running with DEMO_AUTH_ENABLED=true?')));
</script>
</body>
</html>
