<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank assistant</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <header><h1>Bank assistant</h1><span id="who">Signing in…</span></header>
  <main id="log" aria-live="polite"></main>
  <div class="chips" id="chips"></div>
  <form id="f">
    <input id="in" autocomplete="off" maxlength="1000" placeholder="Ask about your balance, a debit, or a cheque book" aria-label="Message">
    <button class="send" id="go" type="submit" disabled>Send</button>
  </form>
</div>
<script src="/static/app.js" defer></script>
</body>
</html>
